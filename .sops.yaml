# sops creation rules (Ticket 12 / DECISIONS 035).
#
# Public keys only — safe to commit. Private keys never live here:
#   - the master age key's private half is in the password manager;
#   - per-host keys ARE the hosts' SSH host ed25519 keys, converted with
#     `ssh-to-age` and filled in at install time (see modules/nixos/core/README.md).
#
# The `age1PLACEHOLDER…` recipients below are replaced per host during secrets
# enrollment, then `sops updatekeys` re-encrypts. They are inert until a
# creation rule that references them is used, so the fixtures rule (test key
# only) works today even while the production placeholders are unfilled.
keys:
  # Personal master key — decrypts everything. Generated once; private half in
  # the password manager (runbook step 1).
  - &master age14wm2hq628h44z306hxc4wx5454waewqxmya04q8tudtfqu59kqmqzeuyx4
  # Per-host keys: ssh-to-age of each /etc/ssh/ssh_host_ed25519_key.pub.
  - &private_laptop age10gjj6tf0cpadle54ng7jv9kllel5jvz6aanj6lmfugflpuwmeq3qcmg437
  - &work_laptop age1PLACEHOLDERworklaptopxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  - &desktop age1uhav7r22gq0ayyt8kkuwsxv8rptrc7hnnwtjndtndyk2trgxy4fslqste3
  - &home_server age15j2scnr49w7n2788fusqpdglpc9kx5avurrumwkas6wr77rkfchsg8sram
  # Fixture/test key: PUBLIC half of the known key the test-secrets nixosTest
  # injects into the VM. Its private half is committed in the test (it guards
  # nothing real). Encrypts only secrets/fixtures/*.
  - &test_fixture age1zhqxhmt7t3vv9z8j24mxvytkx4wu4g6ks8nq9zxwven26nnukulqeck6w2

creation_rules:
  # Test fixtures: encrypted ONLY to the known test key — never to host keys,
  # because the test VM uses the injected test identity, not a real host key.
  - path_regex: secrets/fixtures/[^/]+\.yaml$
    key_groups:
      - age:
          - *test_fixture

  # Host-scoped production secrets (the wireguard key lands here in Ticket 14):
  # master + only the owning host.
  - path_regex: secrets/work-laptop/[^/]+\.yaml$
    key_groups:
      - age:
          - *master
          - *work_laptop

  # Desktop-scoped secrets (the home-server WireGuard client key): master + only
  # the owning host. NOTE the &desktop recipient is still a placeholder — enroll
  # the real desktop age key before creating a file here (hosts/desktop/
  # INSTALL.md), or sops can only encrypt to the master key.
  - path_regex: secrets/desktop/[^/]+\.yaml$
    key_groups:
      - age:
          - *master
          - *desktop

  # Private-laptop-scoped secrets (the home-server WireGuard client key): master
  # + only the owning host. The &private_laptop age key is already enrolled, so a
  # secret can be created here today.
  - path_regex: secrets/private-laptop/[^/]+\.yaml$
    key_groups:
      - age:
          - *master
          - *private_laptop

  # Home-server-scoped secrets: master + the server only. Holds the WireGuard
  # server key (secrets/home-server/wireguard.yaml, read by
  # modules/nixos/server/wireguard.nix) — decrypted at activation, so keyless CI
  # stays green (nothing is decrypted at eval/build).
  - path_regex: secrets/home-server/[^/]+\.yaml$
    key_groups:
      - age:
          - *master
          - *home_server

  # Shared production secrets: master + every host.
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *master
          - *private_laptop
          - *work_laptop
          - *desktop
          - *home_server
