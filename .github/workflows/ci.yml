name: CI

on:
  push:
    # main only — PR branches are covered by the pull_request trigger below, so
    # an unfiltered push trigger would run every PR's CI twice.
    branches: [main]
  pull_request:

permissions:
  contents: read
  # cache-nix-action's purge deletes stale cache entries via the Actions API.
  actions: write

jobs:
  # Enumerate the flake's checks so the `check` job below can fan them out over
  # one runner each. `builtins.attrNames` forces only the attrset keys, so this
  # builds nothing (~1-2 min) and keeps the list dynamic — a new check in
  # flake.nix is picked up with no CI edit (flake stays the source of truth).
  discover-checks:
    name: discover checks
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: experimental-features = nix-command flakes
      - id: list
        run: |
          echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  # One runner per check, all in parallel. This replaces a single `nix flake
  # check -L` that built every host toplevel and booted all eight VM tests
  # serially on one 2-core runner (~52 min). VMs cannot boot concurrently on one
  # runner, so fanning out drops wall-clock to roughly the slowest single check.
  check:
    name: ${{ matrix.check }}
    needs: discover-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover-checks.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The dev environment (Ticket 08) enlarges every host/VM closure, which
      # can exhaust the runner's root disk. Reclaim space from preinstalled SDKs
      # before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      # nix-quick-install (not the Determinate daemon installer): cache-nix-action
      # below restores /nix directly, which only works with this single-user
      # store layout. The nix_conf carries what extra-conf used to:
      # nixos-test so the VM tests run, and the chaotic cache so the test-gaming
      # nixosTest pulls the CachyOS kernel as a substitute instead of compiling it.
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            extra-system-features = nixos-test
            extra-substituters = https://nyx-cache.chaotic.cx/
            extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=
      # Per-check cache entry, mirroring the per-host build cache below: each
      # check caches independently (exact-key hit lets an unchanged check be
      # skipped entirely), with a cross-check fallback restore so a check whose
      # entry is missing still seeds from a sibling. gc-max-store-size is trimmed
      # to 2G because many more entries now share the repo's 10 GB Actions-cache
      # quota; GitHub's LRU eviction absorbs any overflow and evicted paths
      # re-substitute from cache.nixos.org / the chaotic cache rather than rebuild.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-check-${{ matrix.check }}-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: |
            nix-check-${{ matrix.check }}-${{ runner.os }}-
            nix-check-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-check-${{ matrix.check }}-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Building the check derivation is equivalent to what `nix flake check`
      # does for it; formatting/lint are themselves checks (nixfmt-check etc.),
      # so the union of all matrix legs is the same gate as local
      # `nix flake check`.
      - run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}

  build-hosts:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [private-laptop, work-laptop, desktop, home-server]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The dev environment (Ticket 08) enlarges every host closure, which can
      # exhaust the runner's root disk. Reclaim space from preinstalled SDKs
      # before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      # See the check job for why nix-quick-install + cache-nix-action.
      # The desktop closure includes the CachyOS kernel; pull it (and the rest
      # of chaotic) from the chaotic cache instead of building it.
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            extra-substituters = https://nyx-cache.chaotic.cx/
            extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=
      # Per-host cache entries: a single shared key let whichever job finished
      # first (home-server, the smallest closure) save the cache, so the big
      # closures were never cached (run 28596800090). Each host now saves its
      # own entry (gc-trimmed to 4G, zstd-compressed to roughly a quarter of
      # that in the cache), with a cross-host fallback restore so a host whose
      # entry is missing still seeds from a sibling. purge keeps one entry per
      # host; GitHub's LRU eviction absorbs any overflow of the 10 GB quota.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-build-${{ matrix.host }}-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: |
            nix-build-${{ matrix.host }}-${{ runner.os }}-
            nix-build-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-build-${{ matrix.host }}-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Build toplevel
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel -L
