name: CI

on:
  push:
    # main only — PR branches are covered by the pull_request trigger below, so
    # an unfiltered push trigger would run every PR's CI twice.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Enumerate the flake's checks so the `check` job below can fan them out over
  # one runner each. `builtins.attrNames` forces only the attrset keys, so this
  # builds nothing (~1-2 min) and keeps the list dynamic — a new check in
  # flake.nix is picked up with no CI edit (flake stays the source of truth).
  # Split by name: `test-*` (VM tests) get a runner each; everything else
  # (lint, host-assertions) is seconds of work and shares one runner, so those
  # don't hold runner slots the VM tests queue for. A future heavy check not
  # named `test-*` would land in the shared bucket.
  discover-checks:
    name: discover checks
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
      light: ${{ steps.list.outputs.light }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Network-flake hardening, repeated in every job: give up on a stalled
      # download after 60 s instead of the 300 s default, retry it 5 times, and
      # build from source when a substituter is unreachable (fallback). Builds
      # are additionally wrapped in .github/retry.
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            connect-timeout = 15
            stalled-download-timeout = 60
            download-attempts = 5
            fallback = true
      - id: list
        run: |
          isTest='n: builtins.match "test-.*" n != null'
          echo "checks=$(nix eval --json .#checks.x86_64-linux \
            --apply "cs: builtins.filter ($isTest) (builtins.attrNames cs)")" >> "$GITHUB_OUTPUT"
          echo "light=$(nix eval --raw .#checks.x86_64-linux \
            --apply "cs: toString (map (n: \".#checks.x86_64-linux.\${n}\")
              (builtins.filter (n: !(($isTest) n)) (builtins.attrNames cs)))")" >> "$GITHUB_OUTPUT"

  # Build the packages no upstream cache has — Hyprland (with its hypr* libs,
  # aquamarine, glaze and the portal) and Noctalia, both following our nixpkgs,
  # plus the Greenhouse backend/web (public source, own nixpkgs) — once, and
  # push them to the public desktop-nix Cachix cache. Every other job
  # waits for this and pulls them, instead of ~12 runners each compiling them
  # (~20-25 min apiece). Only these package closures are pushed (cachix skips
  # what cache.nixos.org already has); host configs never are, as the cache is
  # public. Only the first run after a lock bump compiles; warm runs take ~1-2 min.
  warm-cache:
    name: warm cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            connect-timeout = 15
            stalled-download-timeout = 60
            download-attempts = 5
            fallback = true
      - uses: cachix/cachix-action@v17
        with:
          name: desktop-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # These derivations are identical on every workstation host, so one
      # host's attributes cover all of them. Greenhouse is taken straight from
      # the flake inputs, exactly as modules/nixos/server/greenhouse.nix does
      # (same drvPath); uncached, home-server and test-greenhouse each spent
      # ~10 min fetching ~1600 crate/npm tarballs and compiling the backend.
      - run: |
          .github/retry nix build -L --no-link \
            .#nixosConfigurations.private-laptop.config.programs.hyprland.package \
            .#nixosConfigurations.private-laptop.config.programs.hyprland.portalPackage \
            .#nixosConfigurations.private-laptop.config.home-manager.users.maudi.programs.noctalia.package
          .github/retry nix build -L --no-link --impure --expr '
            let i = (builtins.getFlake "git+file://${toString ./.}").inputs;
            in [ i.greenhouse-backend.packages.x86_64-linux.default
                 i.greenhouse-web.packages.x86_64-linux.default ]'

  # The cheap checks (lint, host-assertions) in one job; see discover-checks.
  # --keep-going so one failing lint doesn't hide the others.
  light-checks:
    name: lint + assertions
    needs: [discover-checks, warm-cache]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            connect-timeout = 15
            stalled-download-timeout = 60
            download-attempts = 5
            fallback = true
      - uses: cachix/cachix-action@v17
        with:
          name: desktop-nix
          skipPush: true
      - run: .github/retry nix build -L --no-link --keep-going ${{ needs.discover-checks.outputs.light }}

  # One runner per check, all in parallel. This replaces a single `nix flake
  # check -L` that built every host toplevel and booted all eight VM tests
  # serially on one 2-core runner (~52 min). VMs cannot boot concurrently on one
  # runner, so fanning out drops wall-clock to roughly the slowest single check.
  check:
    name: ${{ matrix.check }}
    needs: [discover-checks, warm-cache]
    runs-on: ubuntu-latest
    # The chaotic cache, so test-gaming pulls the CachyOS kernel instead of
    # compiling it (~3 h). Set via NIX_CONFIG, not nix_conf: nix-quick-install
    # and `cachix use` share ~/.config/nix/nix.conf, and the plain
    # `substituters =` line cachix appends resets earlier extra-substituters.
    # NIX_CONFIG is applied after every config file.
    env:
      NIX_CONFIG: |
        extra-substituters = https://nyx-cache.chaotic.cx/
        extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover-checks.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The dev environment (Ticket 08) enlarges every host/VM closure, which
      # can exhaust the runner's root disk. Reclaim space from preinstalled SDKs
      # before building. Backgrounded, since the delete alone took ~2 min of
      # every leg: it finishes long before the build fills the disk, and
      # background processes live until the job ends.
      - name: Free disk space
        run: |
          sudo nohup sh -c 'rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
            docker image prune --all --force' >/dev/null 2>&1 &
      # nixos-test so the VM tests run.
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            extra-system-features = nixos-test
            connect-timeout = 15
            stalled-download-timeout = 60
            download-attempts = 5
            fallback = true
      # Pull-only: warm-cache is the one job that pushes. The Actions cache
      # (cache-nix-action) was dropped: its per-key /nix tarballs, gc-trimmed to
      # fit the 10 GB quota, never retained the Hyprland/Noctalia builds.
      - uses: cachix/cachix-action@v17
        with:
          name: desktop-nix
          skipPush: true
      # Building the check derivation is equivalent to what `nix flake check`
      # does for it; formatting/lint are themselves checks (nixfmt-check etc.),
      # so the union of all matrix legs is the same gate as local
      # `nix flake check`.
      - run: .github/retry nix build -L .#checks.x86_64-linux.${{ matrix.check }}

  build-hosts:
    name: Build ${{ matrix.host }}
    needs: warm-cache
    runs-on: ubuntu-latest
    # The desktop closure includes the CachyOS kernel; see the check job for
    # why the chaotic cache goes through NIX_CONFIG.
    env:
      NIX_CONFIG: |
        extra-substituters = https://nyx-cache.chaotic.cx/
        extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=
    strategy:
      fail-fast: false
      matrix:
        host: [private-laptop, work-laptop, desktop, home-server]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The dev environment (Ticket 08) enlarges every host closure, which can
      # exhaust the runner's root disk. Reclaim space from preinstalled SDKs
      # before building. Backgrounded, since the delete alone took ~2 min of
      # every leg: it finishes long before the build fills the disk, and
      # background processes live until the job ends.
      - name: Free disk space
        run: |
          sudo nohup sh -c 'rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
            docker image prune --all --force' >/dev/null 2>&1 &
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            connect-timeout = 15
            stalled-download-timeout = 60
            download-attempts = 5
            fallback = true
      # Pull-only: warm-cache is the one job that pushes.
      - uses: cachix/cachix-action@v17
        with:
          name: desktop-nix
          skipPush: true
      - name: Build toplevel
        run: .github/retry nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel -L
