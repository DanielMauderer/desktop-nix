name: CI

on:
  push:
    # main only — PR branches are covered by the pull_request trigger below, so
    # an unfiltered push trigger would run every PR's CI twice.
    branches: [main]
  pull_request:

permissions:
  contents: read
  # cache-nix-action's purge deletes stale cache entries via the Actions API.
  actions: write

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The dev environment (Ticket 08) enlarges every host/VM closure, which
      # can exhaust the runner's root disk. Reclaim space from preinstalled SDKs
      # before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      # nix-quick-install (not the Determinate daemon installer): cache-nix-action
      # below restores /nix directly, which only works with this single-user
      # store layout. The nix_conf carries what extra-conf used to:
      # nixos-test so the VM tests run, and the chaotic cache so the test-gaming
      # nixosTest pulls the CachyOS kernel as a substitute instead of compiling it.
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            extra-system-features = nixos-test
            extra-substituters = https://nyx-cache.chaotic.cx/
            extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=
      # Cache /nix in the repo's GitHub Actions cache (replaces the discontinued
      # magic-nix-cache). Exact key hit on unchanged inputs; otherwise restore
      # the newest previous cache and rebuild only the delta. gc-max-store-size
      # trims the store before saving and purge keeps only the newest entry per
      # prefix, so this stays within the repo's 10 GB Actions-cache quota
      # alongside the shared build-hosts cache below.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-check-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-check-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-check-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Formatting is covered by the nixfmt-check flake check, so this single
      # command is the whole gate (local `nix flake check` == CI).
      - run: nix flake check -L

  build-hosts:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [private-laptop, work-laptop, desktop, home-server]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The dev environment (Ticket 08) enlarges every host closure, which can
      # exhaust the runner's root disk. Reclaim space from preinstalled SDKs
      # before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      # See the flake-check job for why nix-quick-install + cache-nix-action.
      # The desktop closure includes the CachyOS kernel; pull it (and the rest
      # of chaotic) from the chaotic cache instead of building it.
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            extra-substituters = https://nyx-cache.chaotic.cx/
            extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=
      # ONE cache shared by all four matrix jobs (not per-host): the host
      # closures overlap heavily, and per-host entries would blow the 10 GB
      # repo quota and evict each other. The first job to finish saves the key;
      # the rest see it exists and skip saving — every later run still restores
      # the common closure and rebuilds only its host's delta.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-build-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Build toplevel
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel -L
